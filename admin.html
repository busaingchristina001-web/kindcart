<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KindCart Owner Dashboard</title><link rel="stylesheet" href="styles.css"><style>.wrap{max-width:1100px;margin:auto;padding:28px 18px}.box{background:#fff;border:1px solid #eee;border-radius:16px;padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.item{border:1px solid #eee;border-radius:14px;padding:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.approve,.confirm{background:#21865b;color:white}.reject,.unpublish{background:#eee7f3}.delete{background:#b42318;color:white}.hidden{display:none}.msg{background:#f4eff8;padding:12px;border-radius:10px}.meta{color:#6e6575;font-size:.9rem}</style></head><body><main class="wrap"><h1>KindCart Dashboard</h1><p id="status">Checking access…</p><p id="msg" class="msg hidden"></p><section id="dash" class="hidden"><div class="box"><h2>GCash payments awaiting verification</h2><p class="meta">Verify the reference in your own GCash transaction history before confirming. Never confirm from the reference number alone.</p><div id="payments" class="grid"></div></div><div class="box"><h2>Requests awaiting review</h2><div id="pending" class="grid"></div></div><div class="box"><h2>Approved wishes</h2><p>Manage wishes you already approved.</p><div id="approved" class="grid"></div></div><a href="index.html">View site ↗</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://utdoqbqxwcnexipseihh.supabase.co','sb_publishable_XeBoR2zNqwDxyxEYCvXkVQ_u5w4e71_');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(Number(n||0));
function message(t){let e=document.getElementById('msg');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),4500)}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){status.textContent='Please log in on KindCart first.';return}const {data:p,error}=await sb.from('profiles').select('role').eq('id',session.user.id).single();if(error||p?.role!=='admin'){status.textContent='Access denied.';return}status.textContent='Owner access confirmed.';dash.classList.remove('hidden');await refresh()}
async function refresh(){await Promise.all([loadWishes(),loadPayments()])}
async function loadWishes(){const {data,error}=await sb.from('wishes').select('id,title,story,category,goal_amount,status,created_at').in('status',['pending','approved']).order('created_at',{ascending:false});if(error){message(error.message);return}draw('pending',data.filter(x=>x.status==='pending'),false);draw('approved',data.filter(x=>x.status==='approved'),true)}
function draw(id,a,approved){let e=document.getElementById(id);if(!a.length){e.innerHTML='<p>No '+(approved?'approved wishes':'pending requests')+'.</p>';return}e.innerHTML=a.map(w=>`<article class="item"><h3>${esc(w.title)}</h3><p>${esc(w.category)} · ${peso(w.goal_amount)}</p><p>${esc(w.story)}</p><div class="actions">${approved?`<button class="unpublish" onclick="changeStatus('${w.id}','closed')">Unpublish</button><button class="delete" onclick="removeWish('${w.id}')">Delete permanently</button>`:`<button class="approve" onclick="changeStatus('${w.id}','approved')">Approve</button><button class="reject" onclick="changeStatus('${w.id}','rejected')">Reject</button>`}</div></article>`).join('')}
async function changeStatus(id,s){if(s==='closed'&&!confirm('Unpublish this wish?'))return;const {error}=await sb.from('wishes').update({status:s}).eq('id',id);if(error)return message(error.message);message('Status updated.');refresh()}
async function removeWish(id){if(!confirm('Permanently delete this wish? This cannot be undone.'))return;const {error}=await sb.from('wishes').delete().eq('id',id);if(error)return message(error.message);message('Wish permanently deleted.');refresh()}
async function loadPayments(){const {data,error}=await sb.from('contributions').select('id,wish_id,amount,payment_reference,payment_status,created_at,wishes(title,goal_amount)').eq('payment_status','pending').order('created_at',{ascending:false});const e=document.getElementById('payments');if(error){e.innerHTML='<p>Could not load payments: '+esc(error.message)+'</p>';return}if(!data.length){e.innerHTML='<p>No payments awaiting verification.</p>';return}e.innerHTML=data.map(c=>`<article class="item"><h3>${esc(c.wishes?.title||'Wish')}</h3><p><strong>${peso(c.amount)}</strong></p><p>GCash reference: <strong>${esc(c.payment_reference)}</strong></p><p class="meta">${new Date(c.created_at).toLocaleString()}</p><div class="actions"><button class="confirm" onclick="paymentStatus('${c.id}','paid')">Confirm payment</button><button class="reject" onclick="paymentStatus('${c.id}','failed')">Reject</button></div></article>`).join('')}
async function paymentStatus(id,s){if(s==='paid'&&!confirm('Confirm only after you verified this exact payment in your GCash transaction history. Continue?'))return;const {error}=await sb.from('contributions').update({payment_status:s}).eq('id',id);if(error)return message(error.message);message(s==='paid'?'Payment confirmed. Funding progress will now include it.':'Payment rejected.');refresh()}
load();
</script></body></html>
