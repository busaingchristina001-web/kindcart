<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KindCart Owner Dashboard</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#f6f3fa}.dash{max-width:1050px;margin:40px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.metric,.panel{background:white;border:1px solid #e8e1ec;border-radius:18px;padding:20px}.metric b{font-size:30px;display:block}.row{display:grid;grid-template-columns:1.4fr .7fr 1fr;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.approve,.reject{border:0;border-radius:8px;padding:8px;cursor:pointer;font-weight:bold}.approve{background:#e5f7ef}.reject{background:#ffe5eb}.blocked{max-width:600px;margin:80px auto;background:white;padding:30px;border-radius:20px}@media(max-width:650px){.metrics{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div id="blocked" class="blocked"><small>OWNER AREA</small><h1 style="font-size:42px">Checking access…</h1><p id="blockMsg">Please wait.</p><a class="alt" href="index.html">← Back to KindCart</a></div><div id="dash" class="dash" style="display:none"><div class="top"><div><small>OWNER AREA</small><h1 style="font-size:42px">KindCart Dashboard</h1></div><a class="alt" href="index.html">View site ↗</a></div><div class="metrics"><div class="metric">Approved<b id="pub">0</b></div><div class="metric">Pending<b id="pc">0</b></div><div class="metric">Payments<b>Off</b></div></div><div class="panel"><h2>Requests awaiting review</h2><div id="pending"></div></div></div><script>
const URL='https://utdoqbqxwcnexipseihh.supabase.co', KEY='sb_publishable_XeBoR2zNqwDxyxEYCvXkVQ_u5w4e71_'; const sb=window.supabase.createClient(URL,KEY); const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); let wishes=[];
async function start(){const {data:{user}}=await sb.auth.getUser();if(!user){blockMsg.innerHTML='Log in on the main KindCart page first.';return}const {data:profile}=await sb.from('profiles').select('role').eq('id',user.id).single();if(!profile||profile.role!=='admin'){blockMsg.textContent='This account does not have owner/admin access.';return}blocked.style.display='none';dash.style.display='block';load()}
async function load(){const {data,error}=await sb.from('wishes').select('id,title,category,goal_amount,status,created_at').order('created_at',{ascending:false});if(error){pending.textContent=error.message;return}wishes=data||[];pub.textContent=wishes.filter(x=>['approved','funded'].includes(x.status)).length;const p=wishes.filter(x=>x.status==='pending');pc.textContent=p.length;pending.innerHTML=p.length?'':'<p>No pending requests.</p>';p.forEach(w=>pending.insertAdjacentHTML('beforeend',`<div class="row"><div><b>${esc(w.title)}</b><br><small>${esc(w.category)}</small></div><div>₱${Number(w.goal_amount).toLocaleString('en-PH')}</div><div><button class="approve" onclick="setStatus('${w.id}','approved')">Approve</button> <button class="reject" onclick="setStatus('${w.id}','rejected')">Reject</button></div></div>`))}
async function setStatus(id,status){const {error}=await sb.from('wishes').update({status}).eq('id',id);if(error)alert(error.message);else load()} start();
</script></body></html>
